name: Docker Image build CI

on:
  #push:
  #  branches: [ master ]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64,linux/arm/v7'
        type: string

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    # get knxd repository tag
    - uses: oprypin/find-latest-tag@v1
      with:
        repository: knxd/knxd
        prefix: debian
      id: knxdtag

    # manipulate knxd repository tag
    - uses: frabert/replace-string-action@v2.5
      with:
        pattern: '^debian\/(.+)$'
        string: ${{ steps.knxdtag.outputs.tag }}
        replace-with: '$1'
      id: repotag

    # prepare for multi arch images
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      # don't login to GHCR, if running with act
      if: github.event_name != 'pull_request' && !env.ACT
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: true
    
    - name: Docker meta
      id: meta
      if: ${{ !env.ACT }}
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/anttin/knxd
        flavor: latest=true
        # generate Docker tags based on the GitHub run number (for unique identification) and the knxd version
        tags: |
          type=raw,value=${{ github.run_number }}
          type=raw,value=${{ steps.repotag.outputs.replaced }}
    
    - name: Set tags for act
      id: tags-act
      if: ${{ env.ACT }}
      run: |
        echo "tags=ghcr.io/anttin/knxd:latest,ghcr.io/anttin/knxd:${{ steps.repotag.outputs.replaced }}" >> $GITHUB_OUTPUT
    - name: Set platforms
      id: platforms
      run: |
        if [ "$ACT" = "true" ]; then
          echo "platforms=linux/arm64" >> $GITHUB_OUTPUT
        else
          echo "platforms=${{ inputs.platforms }}" >> $GITHUB_OUTPUT
        fi
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ steps.platforms.outputs.platforms }}
        push: ${{ github.event_name != 'pull_request' && !env.ACT }}
        tags: ${{ env.ACT && steps.tags-act.outputs.tags || steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
